# ─────────────────────────────────────────────────────────────────────────────
#  BuddBull — Local development docker-compose
#
#  Services:
#    api       — Node.js Express backend (hot-reload via nodemon)
#
#  Usage:
#    docker compose up -d          # start all services
#    docker compose logs -f api    # tail API logs
#    docker compose down -v        # stop and remove volumes
# ─────────────────────────────────────────────────────────────────────────────

services:

  # ── API (Node.js / Express) ────────────────────────────────────────────────
  api:
    build:
      context: ./backend
      target: development # uses the dev stage in backend/Dockerfile
    container_name: buddbull_api
    restart: unless-stopped
    ports:
      - "5000:5000"
    env_file:
      - ./backend/.env
    environment:
      NODE_ENV: development
    volumes:
      # Hot-reload: mount source code
      - ./backend:/app
      # Prevent overwriting node_modules inside the container
      - /app/node_modules
      # Persist uploads between restarts
      - uploads_data:/app/uploads
    healthcheck:
      test: [ "CMD", "wget", "-qO-", "http://localhost:5000/health" ]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  uploads_data:

networks:
  default:
    name: buddbull_network
